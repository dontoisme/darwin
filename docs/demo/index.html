<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Darwin - Screenshot Viewer</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --border: #30363d;
            --accent: #58a6ff;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            /* Safe area insets for notched phones */
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            gap: 24px;
        }
        .header h1 {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mode-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-tertiary);
            padding: 4px;
            border-radius: 8px;
        }
        .mode-tab {
            padding: 8px 16px;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .mode-tab:hover { color: var(--text); }
        .mode-tab.active {
            background: var(--accent);
            color: var(--bg);
        }
        .header-controls {
            margin-left: auto;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .capture-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        /* Map Toolbar Filters */
        .map-toolbar {
            display: none;
            align-items: center;
            gap: 8px;
            margin-left: 16px;
            padding-left: 16px;
            border-left: 1px solid var(--border);
        }
        .map-toolbar.visible { display: flex; }
        .filter-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .filter-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-right: 4px;
        }
        .filter-btn {
            padding: 4px 10px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-muted);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .filter-btn:hover { border-color: var(--text-muted); color: var(--text); }
        .filter-btn.active {
            border-color: currentColor;
            color: var(--text);
            background: var(--bg-secondary);
        }
        .filter-btn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .filter-divider {
            width: 1px;
            height: 20px;
            background: var(--border);
            margin: 0 8px;
        }
        .toggle-btn {
            padding: 4px 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-muted);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .toggle-btn:hover { color: var(--text); }
        .toggle-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

        /* Main content */
        .main {
            padding-top: 60px;
            min-height: 100vh;
        }

        /* Single/Compare View */
        .view-single, .view-compare {
            padding: 20px;
        }
        .screen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .screen-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .screen-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .screen-card.faded {
            opacity: 0.3;
        }
        .screen-card.changed {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 0 1px var(--accent-yellow);
        }
        .screen-card img {
            width: 100%;
            display: block;
        }
        .screen-card .label {
            padding: 12px;
            border-top: 1px solid var(--border);
        }
        .screen-card .label h3 {
            font-size: 14px;
            margin-bottom: 4px;
        }
        .screen-card .label .id {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
        }
        .screen-card .change-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--accent-yellow);
            color: var(--bg);
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
        }

        /* Compare mode */
        .compare-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }
        .compare-column h2 {
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--text-muted);
        }

        /* Timelapse */
        .timelapse-controls {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
        }
        .timeline-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: var(--bg-tertiary);
            border-radius: 4px;
            outline: none;
        }
        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }
        .timeline-info {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 14px;
        }
        .timeline-commit {
            font-family: monospace;
            color: var(--accent);
        }
        .play-btn {
            background: var(--accent);
            border: none;
            color: var(--bg);
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .timelapse-filter-btns {
            display: flex;
            gap: 4px;
        }
        .timelapse-filter-btns button {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .timelapse-filter-btns button.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }
        .commit-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
            margin-top: 8px;
        }
        .commit-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .commit-item.active {
            border-color: var(--accent);
            background: var(--bg-secondary);
        }
        .commit-item.changed {
            color: var(--accent-yellow);
        }
        .commit-item input[type="checkbox"] {
            width: 12px;
            height: 12px;
            margin: 0;
            cursor: pointer;
        }
        .timelapse-counter {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 8px;
        }

        /* Map View */
        .map-container {
            position: fixed;
            top: 60px; left: 0; right: 0; bottom: 100px;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            overscroll-behavior: contain;
        }
        .map-container:active { cursor: grabbing; }
        .map-canvas {
            position: absolute;
            transform-origin: 0 0;
        }
        .map-screen {
            position: absolute;
            background: var(--bg-secondary);
            border: 3px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .map-screen:hover {
            transform: scale(1.02);
            z-index: 10;
        }
        .map-screen.faded {
            opacity: 0.25;
        }
        .map-screen.changed {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 20px rgba(210, 153, 34, 0.5);
            z-index: 5;
        }
        .map-screen.new-screen {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(63, 185, 80, 0.5);
            z-index: 5;
        }
        .map-screen img { width: 100%; display: block; }
        .map-screen .screen-label {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 40px 12px 12px;
            font-size: 12px;
            color: white;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .map-screen:hover .screen-label { opacity: 1; }
        .map-connections {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            z-index: 1;
        }
        .connection {
            fill: none;
            stroke: var(--accent-red);
            stroke-width: 5;
            opacity: 0.8;
            stroke-linecap: round;
        }
        .connection.hidden { opacity: 0; }
        .connection-arrow {
            fill: var(--accent-red);
            opacity: 0.9;
        }
        .connection-arrow.hidden { opacity: 0; }

        /* Map Timeline Controls */
        .map-timeline {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 100px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            z-index: 100;
        }
        .timeline-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .timeline-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .timeline-btn:hover { background: var(--border); }
        .timeline-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        .speed-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        .timeline-track {
            flex: 1;
            position: relative;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
        }
        .timeline-progress {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.1s;
        }
        .timeline-markers {
            position: absolute;
            top: -4px; left: 0; right: 0; bottom: -4px;
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }
        .timeline-marker {
            width: 4px;
            height: 16px;
            background: var(--border);
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .timeline-marker:hover { background: var(--accent); }
        .timeline-marker.active { background: var(--accent); }
        .timeline-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
        }
        .timeline-info .commit { font-family: monospace; color: var(--accent); }
        .timeline-info .changes { color: var(--accent-yellow); }

        /* Legend */
        .legend {
            position: fixed;
            top: 80px; left: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            z-index: 50;
            font-size: 13px;
        }
        .legend h4 {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            touch-action: none;
            overscroll-behavior: contain;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border-radius: 12px;
            max-width: 95vw;
            max-height: 95vh;
            overflow: hidden;
            display: flex;
            overscroll-behavior: contain;
        }
        .modal img {
            max-height: 90vh;
            max-width: 70vw;
            object-fit: contain;
        }
        .modal-info {
            width: 500px;
            padding: 24px;
            border-left: 1px solid var(--border);
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
        .modal-info h2 { font-size: 20px; margin-bottom: 8px; }
        .modal-info .id { font-family: monospace; color: var(--text-muted); margin-bottom: 16px; }
        .modal-info h4 { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin: 16px 0 8px; }
        .modal-info ul { list-style: none; font-size: 14px; }
        .modal-info li { padding: 4px 0; }
        .modal-info a { color: var(--accent); text-decoration: none; }

        /* Mini-map in modal */
        .mini-map {
            background: var(--bg);
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            position: relative;
            height: 280px;
            overflow: hidden;
        }
        .mini-map-canvas {
            position: absolute;
            top: 36px;
            left: 0;
            width: 600px;
            height: 400px;
            cursor: grab;
            transform: translate(0, 0);
            transition: none;
        }
        .mini-map-canvas.panning {
            cursor: grabbing;
        }
        .mini-map-canvas:active {
            cursor: grabbing;
        }
        .mini-screen {
            position: absolute;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 6px;
            width: 50px;
            height: 85px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: var(--text-muted);
            text-align: center;
            overflow: hidden;
        }
        .mini-screen:hover {
            border-color: var(--accent);
            transform: scale(1.1);
            z-index: 10;
        }
        .mini-screen.current {
            border-color: var(--accent);
            background: var(--bg-secondary);
            width: 70px;
            height: 120px;
            z-index: 5;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
        }
        .mini-screen.incoming { border-color: var(--accent-green); }
        .mini-screen.outgoing { border-color: var(--accent-yellow); }
        .mini-screen.bidirectional { border-color: var(--accent-purple); }
        .mini-map-svg {
            position: absolute;
            top: 0; left: 0;
            width: 600px;
            height: 400px;
            pointer-events: none;
        }
        .mini-connection {
            fill: none;
            stroke: var(--border);
            stroke-width: 3;
            opacity: 0.7;
        }
        .mini-connection.incoming { stroke: var(--accent-green); }
        .mini-connection.outgoing { stroke: var(--accent-yellow); }
        .mini-connection.bidirectional { stroke: var(--accent-purple); }
        .mini-arrow {
            fill: var(--border);
        }
        .mini-arrow.incoming { fill: var(--accent-green); }
        .mini-arrow.outgoing { fill: var(--accent-yellow); }
        .mini-arrow.bidirectional { fill: var(--accent-purple); }
        .mini-map-legend {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: var(--text);
            margin-bottom: 8px;
            justify-content: center;
            padding: 6px 10px;
            background: var(--bg-tertiary);
            border-radius: 4px;
        }
        .mini-map-legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .mini-map-legend .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        /* Hover states for mini-map */
        .mini-map-canvas.has-hover .mini-screen {
            opacity: 0.25;
            transition: opacity 0.2s;
        }
        .mini-map-canvas.has-hover .mini-screen.current,
        .mini-map-canvas.has-hover .mini-screen.hover-target {
            opacity: 1;
        }
        .mini-map-canvas.has-hover .mini-connection {
            opacity: 0.15;
        }
        .mini-map-canvas.has-hover .mini-connection.hover-active {
            opacity: 1;
        }
        .modal-close {
            position: fixed;
            top: 20px; right: 20px;
            background: var(--border);
            border: none;
            color: var(--text);
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            z-index: 2001;
        }

        /* Screen Evolution Timeline */
        .screen-evolution {
            background: var(--bg);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }
        .evolution-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .evolution-header h4 {
            margin: 0;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .evolution-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .evolution-controls button {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .evolution-controls button:hover {
            border-color: var(--accent);
        }
        .evolution-controls button.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }
        .evolution-filmstrip {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 8px 0;
            scroll-behavior: smooth;
        }
        .evolution-filmstrip::-webkit-scrollbar {
            height: 6px;
        }
        .evolution-filmstrip::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }
        .evolution-filmstrip::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .evolution-frame {
            flex-shrink: 0;
            width: 80px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        .evolution-frame:hover {
            transform: scale(1.05);
        }
        .evolution-frame.active {
            transform: scale(1.05);
        }
        .evolution-frame.active::after {
            content: '';
            position: absolute;
            inset: -4px;
            border: 2px solid var(--accent);
            border-radius: 10px;
            pointer-events: none;
        }
        .evolution-frame.changed {
            border-color: var(--accent-yellow);
        }
        .evolution-frame.changed::before {
            content: '●';
            position: absolute;
            top: -6px;
            right: -2px;
            color: var(--accent-yellow);
            font-size: 14px;
            z-index: 1;
        }
        .evolution-frame img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid var(--border);
            background: var(--bg-tertiary);
        }
        .evolution-frame .frame-info {
            margin-top: 6px;
            text-align: center;
        }
        .evolution-frame .commit {
            font-family: monospace;
            font-size: 10px;
            color: var(--accent);
        }
        .evolution-frame .change-pct {
            font-size: 9px;
            color: var(--accent-yellow);
            margin-top: 2px;
        }
        .evolution-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 20px;
        }
        .evolution-counter {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Filters */
        .filters {
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .filter-label {
            font-size: 14px;
            color: var(--text-muted);
        }
        .filter-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        /* Mobile menu toggle */
        .mobile-menu-btn {
            display: none;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        /* Mobile responsive styles */
        @media (max-width: 768px) {
            /* Header adjustments */
            .header {
                height: auto;
                min-height: 60px;
                flex-wrap: wrap;
                padding: 12px 16px;
                gap: 12px;
            }
            .header h1 {
                font-size: 16px;
            }
            .mode-tabs {
                order: 3;
                width: 100%;
                justify-content: center;
            }
            .mode-tab {
                padding: 10px 14px;
                font-size: 13px;
            }
            .header-controls {
                order: 2;
            }
            .capture-select {
                max-width: 120px;
                font-size: 12px;
                padding: 6px 8px;
            }
            .mobile-menu-btn {
                display: block;
                order: 4;
            }

            /* Map toolbar - collapsible on mobile */
            .map-toolbar {
                display: none !important;
                position: fixed;
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                background: var(--bg-secondary);
                border-top: 1px solid var(--border);
                padding: 16px;
                flex-direction: column;
                gap: 12px;
                z-index: 999;
                max-height: 50vh;
                overflow-y: auto;
            }
            .map-toolbar.mobile-open {
                display: flex !important;
            }
            .map-toolbar .filter-divider {
                display: none;
            }
            .map-toolbar .filter-group {
                flex-wrap: wrap;
                justify-content: center;
            }
            .map-toolbar .filter-btn {
                padding: 8px 14px;
                font-size: 14px;
            }
            .map-toolbar .toggle-btn {
                padding: 8px 14px;
                font-size: 14px;
            }

            /* Main content */
            .main {
                padding-top: 110px;
            }

            /* Legend - hide on mobile, show in toolbar */
            .legend {
                display: none;
            }

            /* Modal - stack vertically */
            .modal {
                flex-direction: column;
                max-width: 100vw;
                max-height: 100vh;
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
            .modal img {
                max-height: 50vh;
                max-width: 100vw;
                width: 100%;
                object-fit: contain;
            }
            .modal-info {
                width: 100%;
                max-height: 45vh;
                overflow-y: auto;
                padding: 12px 16px;
                border-left: none;
                border-top: 1px solid var(--border);
            }
            .modal-info h2 {
                font-size: 16px;
            }
            .modal-info h4 {
                font-size: 11px;
                margin: 10px 0 6px;
            }
            .modal-info ul {
                font-size: 13px;
            }
            .modal-close {
                top: calc(10px + var(--safe-area-top));
                right: 10px;
            }

            /* Mini-map for mobile - larger screens, no scaling */
            .mini-map {
                height: 280px;
                padding: 8px;
                overflow: hidden;
            }
            .mini-map-legend {
                font-size: 10px;
                gap: 8px;
                padding: 4px 8px;
            }
            /* Larger screens for better mobile visibility */
            .mini-screen {
                width: 60px;
                height: 100px;
                font-size: 9px;
                border-width: 2px;
            }
            .mini-screen.current {
                width: 80px;
                height: 135px;
            }
            /* Thicker connection lines for visibility */
            .mini-connection {
                stroke-width: 4px;
            }

            /* Evolution filmstrip */
            .screen-evolution {
                padding: 12px;
            }
            .evolution-header {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }
            .evolution-controls {
                width: 100%;
                justify-content: space-between;
            }
            .evolution-controls button {
                padding: 8px 10px;
                font-size: 11px;
            }
            .evolution-filmstrip {
                -webkit-overflow-scrolling: touch;
                scroll-snap-type: x proximity;
                overscroll-behavior-x: contain;
            }
            .evolution-frame {
                width: 60px;
                scroll-snap-align: center;
            }
            .evolution-frame img {
                height: 105px;
            }
            .evolution-frame .commit {
                font-size: 9px;
            }
            .evolution-frame .change-pct {
                font-size: 8px;
            }

            /* Map timeline controls - compact for mobile */
            .map-timeline {
                height: auto;
                min-height: 75px;
                padding: 10px 12px;
                padding-bottom: calc(10px + var(--safe-area-bottom));
            }
            .timeline-row {
                gap: 8px;
                flex-wrap: wrap;
            }
            .timeline-btn {
                padding: 6px 10px;
                font-size: 11px;
            }
            .timeline-info {
                font-size: 11px;
            }
            .map-container {
                bottom: 75px;
            }

            /* Timelapse controls safe area */
            .timelapse-controls {
                padding-bottom: calc(16px + var(--safe-area-bottom));
            }
            .commit-list {
                -webkit-overflow-scrolling: touch;
                scroll-snap-type: x proximity;
                overscroll-behavior-x: contain;
            }
            .timeline-controls {
                flex-wrap: wrap;
                gap: 8px;
            }
            .timeline-controls button {
                padding: 8px 12px;
                font-size: 12px;
            }
            .timeline-track-container {
                min-width: 100%;
                margin-top: 8px;
            }

            /* Screen cards in single view */
            .view-single {
                padding: 16px !important;
            }
            .screen-card {
                width: calc(50% - 8px) !important;
            }

            /* Compare view */
            .view-compare {
                flex-direction: column !important;
            }
            .compare-panel {
                width: 100% !important;
                max-height: 50vh;
            }

            /* Map view mobile - labels visible, thicker lines */
            .map-screen .screen-label {
                font-size: 11px !important;
                opacity: 1 !important;
            }
            .connection {
                stroke-width: 6 !important;
            }
        }

        /* Medium mobile phones (iPhone 6/7/8/X/11/12/13/14) */
        @media (max-width: 480px) {
            .header {
                padding: 10px 12px;
                gap: 10px;
            }
            .header h1 {
                font-size: 15px;
            }
            .mode-tabs {
                padding: 3px;
            }
            .mode-tab {
                padding: 8px 12px;
                font-size: 12px;
            }
            .capture-select {
                max-width: 100px;
                font-size: 11px;
            }
            .screen-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .screen-card .label {
                padding: 10px;
            }
            .screen-card .label h3 {
                font-size: 13px;
            }
            .map-screen .screen-label {
                font-size: 10px !important;
            }
            .modal-close {
                width: 36px;
                height: 36px;
                font-size: 20px;
            }
            .modal-info {
                max-height: 40vh;
                padding: 12px;
            }
            /* Mini-map - slightly smaller on phones but still visible */
            .mini-screen {
                width: 55px;
                height: 90px;
            }
            .mini-screen.current {
                width: 75px;
                height: 125px;
            }
            .evolution-frame {
                width: 55px;
            }
            .evolution-frame img {
                height: 95px;
            }
            .map-timeline {
                min-height: 70px;
                padding: 8px 10px;
                padding-bottom: calc(8px + var(--safe-area-bottom));
            }
            .timeline-btn {
                padding: 5px 8px;
                font-size: 10px;
            }
            .speed-select {
                padding: 5px 8px;
                font-size: 10px;
            }
            .map-container {
                bottom: 70px;
            }
            /* Commit list mobile */
            .commit-item {
                padding: 8px 10px;
                font-size: 12px;
            }
            .timelapse-filter-btns button {
                padding: 8px 10px;
                font-size: 11px;
            }
        }

        /* Extra small screens (iPhone SE, etc) */
        @media (max-width: 390px) {
            .mode-tab {
                padding: 8px 10px;
                font-size: 12px;
            }
            .screen-card {
                width: 100% !important;
            }
            .evolution-frame {
                width: 50px;
            }
            .evolution-frame img {
                height: 85px;
            }
            /* Slightly thicker lines for smallest screens */
            .connection {
                stroke-width: 7 !important;
            }
        }

        /* Touch-friendly tap targets */
        @media (pointer: coarse) {
            .filter-btn, .toggle-btn, .mode-tab, button {
                min-height: 44px;
            }
            /* Larger checkboxes for touch */
            .commit-item input[type="checkbox"] {
                width: 20px;
                height: 20px;
            }
            .filter-toggle input[type="checkbox"] {
                width: 22px;
                height: 22px;
            }
            /* Larger timeline markers */
            .timeline-marker {
                width: 8px;
                height: 20px;
            }
            /* Commit list touch targets */
            .commit-item {
                min-height: 44px;
                padding: 10px 12px;
            }
            .map-screen {
                cursor: pointer;
            }
        }

<body>
    <header class="header">
        <a href="../" style="text-decoration: none; color: inherit;"><h1>🧬 Darwin</h1></a>
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="map">Map</button>
            <button class="mode-tab" data-mode="single">Single</button>
            <button class="mode-tab" data-mode="compare">Compare</button>
        </div>
        <div class="map-toolbar" id="mapToolbar">
            <span class="filter-label">Groups</span>
            <div class="filter-group" id="groupFilters"></div>
            <div class="filter-divider"></div>
            <span class="filter-label">Show</span>
            <div class="filter-group" id="changeFilters">
                <button class="filter-btn active" data-filter="all" onclick="setChangeFilter('all')">All</button>
                <button class="filter-btn" data-filter="changed" onclick="setChangeFilter('changed')">
                    <span class="dot" style="background: var(--accent-yellow)"></span>Changed
                </button>
                <button class="filter-btn" data-filter="new" onclick="setChangeFilter('new')">
                    <span class="dot" style="background: var(--accent-green)"></span>New
                </button>
            </div>
            <div class="filter-divider"></div>
            <button class="toggle-btn active" id="showFlowsBtn" onclick="toggleFlows()">Flows</button>
            <div class="filter-divider"></div>
            <button class="toggle-btn" id="unfadeBtn" onclick="toggleUnfade()">Show All</button>
        </div>
        <div class="header-controls">
            <select class="capture-select" id="captureSelect"></select>
            <select class="capture-select" id="captureSelect2" style="display:none"></select>
        </div>
        <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileMenu()">☰ Filters</button>
    </header>

    <main class="main" id="main">
        <!-- Content rendered by JS -->
    </main>

    <div class="modal-overlay" id="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal">
            <img id="modalImg" src="">
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <div class="id" id="modalId"></div>
                <h4>Flows To</h4>
                <ul id="modalFlows"></ul>
                <h4>Source Files</h4>
                <ul id="modalSources"></ul>

                <div class="screen-evolution" id="screenEvolution">
                    <div class="evolution-header">
                        <h4>Screen Evolution</h4>
                        <div class="evolution-controls">
                            <button id="evoChangesBtn" class="active" onclick="setEvolutionFilter(false)">Changes</button>
                            <button id="evoAllBtn" onclick="setEvolutionFilter(true)">All</button>
                            <button id="evoPlayBtn" onclick="toggleEvolutionPlay()">▶ Play</button>
                            <span class="evolution-counter" id="evoCounter">1 / 5</span>
                        </div>
                    </div>
                    <div class="evolution-filmstrip" id="evolutionFilmstrip">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

                <h4>Connection Map</h4>
                <div class="mini-map">
                    <div class="mini-map-legend">
                        <span><div class="dot" style="background: var(--accent-green)"></div> Incoming</span>
                        <span><div class="dot" style="background: var(--accent-yellow)"></div> Outgoing</span>
                        <span><div class="dot" style="background: var(--accent-purple)"></div> Both</span>
                    </div>
                    <div class="mini-map-canvas" id="miniMapCanvas">
                        <svg class="mini-map-svg" id="miniMapSvg"></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

        const CAPTURES_DIR = "captures";

        let manualChangedCommits = new Set(); // Manually marked as changed

        let evolutionTimer = null;
        let evolutionShowAll = false; // Default to changes-only mode

        let miniMapPanY = 0;
        let miniMapIsPanning = false;
        let miniMapStartX = 0;
        let miniMapStartY = 0;

        // Map state
        let mapScale = 0.25;
        let mapTranslateX = 50;
        let mapTranslateY = 50;
        let isDragging = false;
        let dragStartX, dragStartY;

        // Timeline state for map
        let mapTimelineIdx = 0;
        let mapIsPlaying = false;
        let mapPlaybackSpeed = 1500; // ms per frame
        let mapPlaybackTimer = null;

        // Screen positions for map
        const screenPositions = {};

        // Cache for tracking which screens exist in each capture
        const captureScreensCache = {};

        // Filter state
        let activeGroups = new Set(); // empty = all groups shown
        let changeFilter = 'all'; // 'all', 'changed', 'new'
        let showFlows = true;
        let showAllScreens = false; // when true, don't fade unchanged screens
        let layoutDirection = 'vertical'; // 'horizontal' or 'vertical'

        function init() {
            populateCaptureSelects();
            setupEventListeners();
            renderMode();
        }

        function populateCaptureSelects() {
            const select1 = document.getElementById('captureSelect');
            const select2 = document.getElementById('captureSelect2');

            const captures = INDEX.captures || [];
            const lastIdx = captures.length - 1;

            captures.forEach((cap, idx) => {
                const date = new Date(cap.timestamp).toLocaleDateString();
                const isLatest = idx === lastIdx;
                const label = isLatest
                    ? `${cap.id} - ${date} (latest)`
                    : `${cap.id} - ${date}`;

                const opt1 = document.createElement('option');
                opt1.value = cap.id;
                opt1.textContent = label;
                select1.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = cap.id;
                opt2.textContent = label;
                select2.appendChild(opt2);
            });

            if (captures.length > 0) {
                selectedCapture = captures[captures.length - 1].id;
                select1.value = selectedCapture;
                if (captures.length > 1) {
                    selectedCapture2 = captures[captures.length - 2].id;
                    select2.value = selectedCapture2;
                }
            }
        }

        function setupEventListeners() {
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelector('.mode-tab.active').classList.remove('active');
                    tab.classList.add('active');
                    currentMode = tab.dataset.mode;
                    renderMode();
                });
            });

            document.getElementById('captureSelect').addEventListener('change', (e) => {
                selectedCapture = e.target.value;
                renderMode();
            });

            document.getElementById('captureSelect2').addEventListener('change', (e) => {
                selectedCapture2 = e.target.value;
                renderMode();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        }

        function renderMode() {
            const main = document.getElementById('main');
            const select2 = document.getElementById('captureSelect2');
            const mapToolbar = document.getElementById('mapToolbar');

            select2.style.display = currentMode === 'compare' ? 'block' : 'none';
            mapToolbar.classList.toggle('visible', currentMode === 'map');

            // Stop map playback when switching modes
            if (currentMode !== 'map' && mapIsPlaying) {
                mapIsPlaying = false;
                if (mapPlaybackTimer) {
                    clearTimeout(mapPlaybackTimer);
                    mapPlaybackTimer = null;
                }
            }

            switch (currentMode) {
                case 'single':
                    renderSingleView(main);
                    break;
                case 'compare':
                    renderCompareView(main);
                    break;
                case 'map':
                    populateGroupFilters();
                    renderMapView(main);
                    break;
            }
        }

        function populateGroupFilters() {
            const container = document.getElementById('groupFilters');
            const groups = MANIFEST.groups || {};

            container.innerHTML = Object.entries(groups).map(([id, group]) => `
                <button class="filter-btn" data-group="${id}" onclick="toggleGroupFilter('${id}')" style="--group-color: ${group.color}">
                    <span class="dot" style="background: ${group.color}"></span>${group.name}
                </button>
            `).join('');

            // Initialize with no groups selected (empty = show all)
            activeGroups = new Set();
        }

        function toggleGroupFilter(groupId) {
            // New behavior: clicking a group makes it the only selected group
            // Clicking the selected group deselects it (back to showing all)
            if (activeGroups.size === 1 && activeGroups.has(groupId)) {
                // Deselect the only selected group
                activeGroups.clear();
            } else {
                // Select only this group
                activeGroups.clear();
                activeGroups.add(groupId);
            }

            // Update button states
            document.querySelectorAll('.filter-btn[data-group]').forEach(button => {
                const btnGroupId = button.dataset.group;
                button.classList.toggle('active', activeGroups.has(btnGroupId));
            });

            applyMapFilters();
        }

        function setChangeFilter(filter) {
            changeFilter = filter;
            document.querySelectorAll('#changeFilters .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            applyMapFilters();
        }

        function toggleFlows() {
            showFlows = !showFlows;
            const btn = document.getElementById('showFlowsBtn');
            btn.classList.toggle('active', showFlows);
            document.querySelectorAll('.connection, .connection-arrow').forEach(el => {
                el.classList.toggle('hidden', !showFlows);
            });
        }

        function setLayout(direction) {
            layoutDirection = direction;
            document.getElementById('layoutHBtn').classList.toggle('active', direction === 'horizontal');
            document.getElementById('layoutVBtn').classList.toggle('active', direction === 'vertical');
            // Re-render the map with new layout
            renderMapView(document.getElementById('main'));
        }

        function toggleUnfade() {
            showAllScreens = !showAllScreens;
            const btn = document.getElementById('unfadeBtn');
            btn.classList.toggle('active', showAllScreens);
            btn.textContent = showAllScreens ? 'Highlight Changes' : 'Show All';
            // Re-apply timeline to update fading
            updateMapTimeline();
        }

        function toggleMobileMenu() {
            const toolbar = document.getElementById('mapToolbar');
            const btn = document.getElementById('mobileMenuBtn');
            toolbar.classList.toggle('mobile-open');
            btn.textContent = toolbar.classList.contains('mobile-open') ? '✕ Close' : '☰ Filters';
        }

        // Close mobile menu when clicking outside
        document.addEventListener('click', (e) => {
            const toolbar = document.getElementById('mapToolbar');
            const btn = document.getElementById('mobileMenuBtn');
            if (toolbar && toolbar.classList.contains('mobile-open')) {
                if (!toolbar.contains(e.target) && !btn.contains(e.target)) {
                    toolbar.classList.remove('mobile-open');
                    btn.textContent = '☰ Filters';
                }
            }
        });

        function applyMapFilters() {
            const groups = MANIFEST.groups || {};

            // Build set of visible screen IDs based on group filter
            const visibleByGroup = new Set();
            for (const [groupId, group] of Object.entries(groups)) {
                if (activeGroups.size === 0 || activeGroups.has(groupId)) {
                    (group.screens || []).forEach(screenId => visibleByGroup.add(screenId));
                }
            }

            // Apply visibility to each screen
            document.querySelectorAll('.map-screen').forEach(screenDiv => {
                const screenId = screenDiv.dataset.screenId;
                const isInActiveGroup = visibleByGroup.has(screenId);
                const isChanged = screenDiv.classList.contains('changed');
                const isNew = screenDiv.classList.contains('new-screen');

                let visible = isInActiveGroup;

                // Apply change filter
                if (changeFilter === 'changed') {
                    visible = visible && isChanged;
                } else if (changeFilter === 'new') {
                    visible = visible && isNew;
                }

                screenDiv.style.display = visible ? 'block' : 'none';
            });

            // Update connection visibility based on visible screens
            document.querySelectorAll('.connection, .connection-arrow').forEach(el => {
                if (!showFlows) {
                    el.classList.add('hidden');
                    return;
                }
                const from = el.dataset.from;
                const to = el.dataset.to;
                const fromVisible = document.getElementById(`map-screen-${from}`)?.style.display !== 'none';
                const toVisible = document.getElementById(`map-screen-${to}`)?.style.display !== 'none';
                el.classList.toggle('hidden', !fromVisible || !toVisible);
            });
        }

        function renderSingleView(container) {
            const screens = Object.entries(MANIFEST.screens);
            container.innerHTML = `
                <div class="view-single">
                    <div class="screen-grid">
                        ${screens.map(([id, screen]) => `

                                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22500%22><rect fill=%22%23161b22%22 width=%22300%22 height=%22500%22/><text x=%22150%22 y=%22250%22 fill=%22%238b949e%22 text-anchor=%22middle%22>Not captured</text></svg>'">
                                <div class="label">
                                    <h3>${screen.name}</h3>
                                    <div class="id">${id}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCompareView(container) {
            const screens = Object.entries(MANIFEST.screens);
            container.innerHTML = `
                <div class="filters">
                    <span class="filter-label">Show:</span>
                    <label class="filter-toggle">
                        <input type="checkbox" id="showChangedOnly">

                    </label>
                </div>
                <div class="compare-container">
                    <div class="compare-column">
                        <h2>Base: ${selectedCapture2}</h2>
                        <div class="screen-grid" id="compareLeft">

        // Get set of commit IDs that have meaningful changes
        function getChangedCommitIds() {
            const threshold = MANIFEST.changeThreshold || 0.5;
            const changedIds = new Set();
            const allCaptures = INDEX.captures.filter(c => c.screenCount > 0);

            allCaptures.forEach((capture, idx) => {
                if (idx === 0) return; // First is baseline
                const changeData = INDEX.changeData?.[capture.id] || {};
                // Check if ANY screen changed above threshold
                const hasChange = Object.values(changeData).some(pct => pct > threshold);
                if (hasChange || manualChangedCommits.has(capture.id)) {
                    changedIds.add(capture.id);
                }
            });

            // Also include manually marked commits
            manualChangedCommits.forEach(id => changedIds.add(id));

            return changedIds;
        }

        function layoutScreensForMap() {
            // Responsive screen dimensions based on viewport
            const viewportWidth = window.innerWidth;
            let SCREEN_WIDTH, SCREEN_HEIGHT, H_PADDING, V_PADDING;

            if (viewportWidth <= 390) {
                // Extra small (iPhone SE)
                SCREEN_WIDTH = 90;
                SCREEN_HEIGHT = 150;
                H_PADDING = 30;
                V_PADDING = 50;
            } else if (viewportWidth <= 480) {
                // Small phones
                SCREEN_WIDTH = 100;
                SCREEN_HEIGHT = 170;
                H_PADDING = 40;
                V_PADDING = 60;
            } else if (viewportWidth <= 768) {
                // Tablets/large phones
                SCREEN_WIDTH = 120;
                SCREEN_HEIGHT = 200;
                H_PADDING = 50;
                V_PADDING = 80;
            } else {
                // Desktop
                SCREEN_WIDTH = 280;
                SCREEN_HEIGHT = 600;
                H_PADDING = 80;
                V_PADDING = 120;
            }
            const groups = MANIFEST.groups || {};

            // Build reverse flow map (who flows TO this screen)
            const incomingFlows = {};
            for (const [screenId, screen] of Object.entries(MANIFEST.screens)) {
                if (!incomingFlows[screenId]) incomingFlows[screenId] = [];
                for (const targetId of (screen.flows_to || [])) {
                    if (!incomingFlows[targetId]) incomingFlows[targetId] = [];
                    incomingFlows[targetId].push(screenId);
                }
            }

            // Calculate depth for each screen (BFS from roots)
            const screenDepth = {};
            const screenGroup = {};

            // Map screens to their groups
            for (const [groupId, group] of Object.entries(groups)) {
                for (const screenId of (group.screens || [])) {
                    screenGroup[screenId] = { id: groupId, color: group.color, name: group.name };
                }
            }

            // Find root screens per group (first screen in each group, or screens with minimal incoming flows)
            const roots = [];
            for (const [groupId, group] of Object.entries(groups)) {
                const groupScreens = group.screens || [];
                if (groupScreens.length > 0) {
                    // Use first screen as root, or find one with no internal incoming flows
                    let root = groupScreens[0];
                    for (const screenId of groupScreens) {
                        const incoming = (incomingFlows[screenId] || []).filter(s => groupScreens.includes(s));
                        if (incoming.length === 0) {
                            root = screenId;
                            break;
                        }
                    }
                    roots.push({ screenId: root, groupId });
                }
            }

            // BFS to assign depths within each group
            for (const { screenId: rootId, groupId } of roots) {
                const group = groups[groupId];
                const groupScreens = new Set(group.screens || []);
                const queue = [{ id: rootId, depth: 0 }];
                const visited = new Set();

                while (queue.length > 0) {
                    const { id, depth } = queue.shift();
                    if (visited.has(id) || !groupScreens.has(id)) continue;
                    visited.add(id);
                    screenDepth[id] = depth;

                    const screen = MANIFEST.screens[id];
                    for (const targetId of (screen?.flows_to || [])) {
                        if (groupScreens.has(targetId) && !visited.has(targetId)) {
                            queue.push({ id: targetId, depth: depth + 1 });
                        }
                    }
                }

                // Assign depth 0 to any unvisited screens in group
                for (const screenId of groupScreens) {
                    if (screenDepth[screenId] === undefined) {
                        screenDepth[screenId] = 0;
                    }
                }
            }

            // Group screens by depth level within each group
            const groupLevels = {};
            for (const [groupId, group] of Object.entries(groups)) {
                groupLevels[groupId] = {};
                for (const screenId of (group.screens || [])) {
                    const depth = screenDepth[screenId] || 0;
                    if (!groupLevels[groupId][depth]) groupLevels[groupId][depth] = [];
                    groupLevels[groupId][depth].push(screenId);
                }
            }

            // Layout: Groups as columns, depth as rows (like an org chart)
            // Each group gets a column, screens flow top-to-bottom within
            const groupOrder = Object.keys(groups);
            const GROUP_GAP = 100;

            let groupX = 0;

            for (const groupId of groupOrder) {
                const group = groups[groupId];
                const levels = groupLevels[groupId];
                const maxDepth = Math.max(...Object.keys(levels).map(Number), 0);

                // Find max width needed for this group (widest level)
                let maxLevelWidth = 0;
                for (const [depth, screens] of Object.entries(levels)) {
                    maxLevelWidth = Math.max(maxLevelWidth, screens.length);
                }

                const groupWidth = Math.max(maxLevelWidth, 1) * (SCREEN_WIDTH + H_PADDING);

                // Position screens - each depth level is a row
                for (const [depth, screens] of Object.entries(levels)) {
                    const levelY = parseInt(depth) * (SCREEN_HEIGHT + V_PADDING);
                    const levelWidth = screens.length * (SCREEN_WIDTH + H_PADDING) - H_PADDING;
                    const startX = groupX + (groupWidth - levelWidth) / 2;

                    screens.forEach((screenId, i) => {
                        screenPositions[screenId] = {
                            x: startX + i * (SCREEN_WIDTH + H_PADDING),
                            y: levelY,
                            width: SCREEN_WIDTH,
                            height: SCREEN_HEIGHT,
                            color: group.color
                        };
                    });
                }

                groupX += groupWidth + GROUP_GAP;
            }
        }
